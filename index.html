async function hp(p){const e=new TextEncoder().encode(p);const b=await crypto.subtle.digest('SHA-256',e);return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
async function vp(p){const s=localStorage.getItem('tth');if(!s){localStorage.setItem('tth',await hp(DPWD));return p===DPWD;}return await hp(p)===s;}
async function cp(o,n){if(!(await vp(o)))return false;localStorage.setItem('tth',await hp(n));return true;}
function gid(){return'p'+Date.now()+Math.random().toString(36).substr(2,4);}
function fp(p){return gS().cur+p.toLocaleString('en-PK');}
function wu(pr,sz,cl){const s=gS();const ph=s.phone.replace(/[^0-9]/g,'');let m="Hi! I'm interested in \""+pr.name+"\" ("+pr.brand+") priced at "+fp(pr.price)+".";if(sz)m+=" Size: "+sz+".";if(cl)m+=" Color: "+cl+".";m+=" Is it available?";return"https://wa.me/"+ph+"?text="+encodeURIComponent(m);}
function sh(r,sz){let h='';for(let i=1;i<=5;i++){if(i<=Math.floor(r))h+='<i class="fa-solid fa-star star '+sz+'"></i>';else if(i-r<1)h+='<i class="fa-solid fa-star-half-stroke star '+sz+'"></i>';else h+='<i class="fa-regular fa-star stare '+sz+'"></i>';}return h;}
function grv(pid,n){const rv=[];for(let i=0;i<Math.min(n,6);i++){rv.push({name:RNAMES[(pid.length+i)%RNAMES.length],rating:Math.random()>.3?Math.floor(4+Math.random()*1.1):Math.floor(3+Math.random()*1.1),text:REVS[(pid.charCodeAt(1)+i)%REVS.length],date:'May '+(5+i*3)+', 2025',v:i<4,help:Math.floor(Math.random()*30)});}return rv;}
function ci(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej('err');r.onload=(e)=>{const img=new Image();img.onerror=()=>rej('err');img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;if(w>800){h=(800/w)*h;w=800;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.7));};img.src=e.target.result;};r.readAsDataURL(file);});}

// ===== TOAST =====
function toast(msg,type='success',dur=3500){const c=document.getElementById('toasts');const cl={success:'border-l-4 border-sage bg-white',error:'border-l-4 border-red-500 bg-white',info:'border-l-4 border-terracotta bg-white'};const ic={success:'fa-circle-check text-sage',error:'fa-circle-xmark text-red-500',info:'fa-circle-info text-terracotta'};const el=document.createElement('div');el.className='toast pointer-events-auto '+cl[type]+' rounded-xl shadow-lg px-4 py-3 flex items-start gap-3';el.innerHTML='<i class="fa-solid '+ic[type]+' mt-0.5"></i><span class="text-sm text-charcoal flex-1">'+msg+'</span><button onclick="this.parentElement.remove()" class="text-warmgray hover:text-charcoal text-xs ml-1"><i class="fa-solid fa-xmark"></i></button>';c.appendChild(el);setTimeout(()=>{if(el.parentElement){el.style.opacity='0';el.style.transform='translateX(30px)';el.style.transition='all .3s';setTimeout(()=>el.remove(),300);}},dur);}

function om(html){const r=document.getElementById('modal');r.className='fixed inset-0 z-[90] mback afi flex items-center justify-center p-4';r.innerHTML='<div class="mcont bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto">'+html+'</div>';r.onclick=(e)=>{if(e.target===r)cm();};}

let sv=false;
function ts(){sv=!sv;const p=document.getElementById('shortcutspanel');if(sv){p.className='fixed bottom-5 right-5 z-95 w-80 bg-white rounded-xl shadow-2xl p-5 asi';p.style.zIndex='95';p.innerHTML='<div class="flex items-center justify-between mb-4"><h3 class="font-bold text-sm">Keyboard Shortcuts</h3><button onclick="ts()" class="text-warmgray hover:text-charcoal"><i class="fa-solid fa-xmark"></i></button></div><div class="flex flex-col gap-2 text-sm">'+[['Search','Alt + /'],['Cart','Shift+Alt+C'],['Home','Shift+Alt+H'],['About Item','Shift+Alt+D'],['Toggle Shortcuts','Shift+Alt+Z']].map(([l,k])=>'<div class="flex items-center justify-between py-1.5 border-b border-bord last:border-0"><span class="text-warmgray">'+l+'</span><span>'+k.split('+').map(x=>'<span class="kbd">'+x.trim()+'</span>').join(' <span class="text-warmgray text-xs mx-0.5">+</span> ')+'</span></div>').join('')+'</div><p class="text-xs text-warmgray mt-3">Use arrow keys to navigate between items.</p>';}else{p.className='hidden';}}
document.addEventListener('keydown',(e)=>{if(e.altKey&&e.key==='/'){e.preventDefault();document.getElementById('si')?.focus();}if(e.shiftKey&&e.altKey&&e.key.toLowerCase()==='c'){e.preventDefault();nav('/cart');}if(e.shiftKey&&e.altKey&&e.key.toLowerCase()==='h'){e.preventDefault();nav('/');}if(e.shiftKey&&e.altKey&&e.key.toLowerCase()==='d'){e.preventDefault();document.getElementById('abt')?.scrollIntoView({behavior:'smooth',block:'start'});}if(e.shiftKey&&e.altKey&&e.key.toLowerCase()==='z'){e.preventDefault();ts();}if(e.key==='Escape'){cm();if(sv)ts();}});

function gr(){const h=window.location.hash.slice(1)||'/';return{p:h.split('/').filter(Boolean),f:'/'+h.split('/').filter(Boolean).join('/')};}
function nav(p){window.location.hash=p;}
function route(){const{p,f}=gr();const app=document.getElementById('app');window.scrollTo(0,0);selSz='';selCl='';
if(f.startsWith('/admin')){if(f==='/admin/login'||!gA()){app.innerHTML=adminLogin();return;}app.innerHTML=adminWrap(p[1]||'dashboard');return;}
if(f==='/cart'){app.innerHTML=cartPage();return;}

const cat=p[0]&&CATS[p[0]]?p[0]:null;

function addCart(pid,sz,cl){const c=gC();const pr=gP().find(x=>x.id===pid);if(!pr||pr.status==='sold')return;const ex=c.find(x=>x.id===pid&&x.sz===sz&&x.cl===cl);if(ex)ex.qty++;else c.push({id:pid,name:pr.name,brand:pr.brand,price:pr.price,sz,cl,img:pr.imgs[0],qty:1});sC(c);toast('Added to cart!');ucc();}
function rmCart(i){const c=gC();c.splice(i,1);sC(c);toast('Removed.','info');route();}
function uqCart(i,d){const c=gC();c[i].qty+=d;if(c[i].qty<1)c.splice(i,1);sC(c);route();}
function ucc(){const c=gC();const t=c.reduce((a,x)=>a+x.qty,0);document.querySelectorAll('#cc').forEach(el=>{el.textContent=t;el.style.display=t?'':'none';});}

n text-sm mb-2"><span class="text-warmgray">Delivery</span><span class="text-sage font-medium">Free</span></div><div class="border-t border-bord pt-3 mt-3 flex justify-between font-bold"><span>Total</span><span>'+fp(sub)+'</span></div><a href="https://wa.me/'+s.phone.replace(/[^0-9]/g,'')+'?text='+encodeURIComponent("Hi! I'd like to order:\n"+c.map(x=>"- "+x.name+" ("+x.sz+", "+x.cl+") x"+x.qty+" = "+fp(x.price*x.qty)).join('\n')+"\n\nTotal: "+fp(sub))+'" target="_blank" rel="noopener" class="btnwa w-full justify-center mt-4 py-3 text-base"><i class="fa-brands fa-whatsapp text-lg"></i> Checkout via WhatsApp</a><a href="#/" class="block text-center text-sm text-warmgray hover:text-charcoal mt-3">Continue Shopping</a></div></div>')+'</main>'+pubFoot();}

tyle="'+(cn?'':'display:none')+'">'+cn+'</span></a><button onclick="mmenu()" class="md:hidden text-white/80 p-1" aria-label="Menu"><i class="fa-solid fa-bars"></i></button></div></div><nav class="border-t border-white/10 hidden md:block"><div class="max-w-[1400px] mx-auto px-4 flex items-center gap-1 overflow-x-auto" style="scrollbar-width:none"><button onclick="fc(null);nav(\'/\')" class="px-3 py-2 text-xs text-white/70 hover:text-white whitespace-nowrap">All</button>'+Object.entries(CATS).map(([k,v])=>'<button onclick="fc(\''+k+'\');nav(\'/'+k+'\')" class="px-3 py-2 text-xs text-white/70 hover:text-white whitespace-nowrap">'+v.l+'</button>').join('')+'<button onclick="nav(\'/contact\')" class="px-3 py-2 text-xs text-white/70 hover:text-white whitespace-nowrap">Contact</button></div></nav><div id="mm" class="hidden md:hidden border-t border-white/10 bg-charcoal"><div class="px-4 py-2 flex flex-col gap-0.5">'+Object.entries(CATS).map(([k,v])=>'<a href="#/'+k+'" onclick="cmm()" class="px-3 py-2 text-sm text-white/70 hover:text-white hover:bg-white/5 rounded-lg">'+v.l+'</a>').join('')+'<a href="#/contact" onclick="cmm()" class="px-3 py-2 text-sm text-white/70 hover:text-white hover:bg-white/5 rounded-lg">Contact</a><a href="#/admin/login" onclick="cmm()" class="px-3 py-2 text-sm text-white/70 hover:text-white hover:bg-white/5 rounded-lg">Admin</a></div></div></header>';}

function adminDash(){const pr=gP();const av=pr.filter(p=>p.status==='available').length;const sl=pr.filter(p=>p.status==='sold').length;const val=pr.filter(p=>p.status==='available').reduce((a,p)=>a+p.price,0);return'<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6"><div class="bg-white rounded-lg border border-bord p-4"><p class="text-[10px] text-warmgray font-medium uppercase tracking-wider mb-0.5">Total</p><p class="text-xl font-bold">'+pr.length+'</p></div><div class="bg-white rounded-lg border border-bord p-4"><p class="text-[10px] text-warmgray font-medium uppercase tracking-wider mb-0.5">Available</p><p class="text-xl font-bold text-sage">'+av+'</p></div><div class="bg-white rounded-lg border border-bord p-4"><p class="text-[10px] text-warmgray font-medium uppercase tracking-wider mb-0.5">Sold</p><p class="text-xl font-bold text-warmgray">'+sl+'</p></div><div class="bg-white rounded-lg border border-bord p-4"><p class="text-[10px] text-warmgray font-medium uppercase tracking-wider mb-0.5">Value</p><p class="text-xl font-bold text-terracotta">'+fp(val)+'</p></div></div><div class="bg-white rounded-lg border border-bord overflow-hidden"><div class="px-4 py-3 border-b border-bord flex items-center justify-between"><h3 class="font-semibold text-sm">Products ('+pr.length+')</h3><a href="#/admin/add-product" class="btnp text-xs px-3 py-1.5"><i class="fa-solid fa-plus mr-1"></i>Add</a></div><div class="overflow-x-auto"><table class="atable"><thead><tr><th>Product</th><th class="hidden sm:table-cell">Cat</th><th class="hidden md:table-cell">Price</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+pr.slice(0,50).map(p=>'<tr><td><div class="flex items-center gap-2"><img src="'+p.imgs[0]+'" class="w-8 h-8 rounded object-cover flex-shrink-0" alt="'+p.name+'"><span class="font-medium text-xs truncate max-w-[120px]">'+p.name+'</span></div></td><td class="hidden sm:table-cell"><span class="text-[10px] bg-sand px-1.5 py-0.5 rounded">'+CATS[p.cat]?.l+'</span></td> function adminAdd(){return'<div class="max-w-lg"><div class="bg-white rounded-lg border border-bord p-5"><form onsubmit="hAdd(event)"><div class="mb-5"><label class="block text-sm font-medium mb-1.5">Image</label><div class="upload-area" id="ua" onclick="document.getElementById(\'fi\').click()" style="border:2px dashed #E8E2D9;border-radius:10px;padding:28px;text-align:center;cursor:pointer;transition:all .2s;background:#F0EBE3" ondragover="event.preventDefault();this.style.borderColor=\'#C45D3E\'" ondragleave="this.style.borderColor=\'#E8E2D9\'" ondrop="hDrop(event)"><div id="up"><i class="fa-solid fa-cloud-arrow-up text-xl text-warmgray mb-1"></i><p class="text-xs text-warmgray">Click or drag image</p></div><div id="uv" class="hidden"></div></div><input type="file" id="fi" accept="image/*" class="hidden" onchange="hFS(this)"></div><div class="mb-3"><label class="block text-sm font-medium mb-1">Name</label><input type="text" id="pn" class="inp" required></div><div class="mb-3"><label class="block text-sm font-medium mb-1">Brand</label><input type="text" id="pb" class="inp" required></div><div class="mb-3"><label class="block text-sm font-medium mb-1">Price</label><input type="number" id="pp" class="inp" min="1" required></div><div class="mb-3"><label class="block text-sm font-medium mb-1">Original Price (optional)</label><input type="number" id="po" class="inp" min="0"></div><div class="mb-3"><label class="block text-sm font-medium mb-1">Description</label><textarea id="pd" class="inp" rows="2" required></textarea></div><div class="grid grid-cols-2 gap-3 mb-5"><div><label class="block text-sm font-medium mb-1">Category</label><select id="pc" class="inp" onchange="uSubs()" required><option value="">Select...</option>'+Object.entries(CATS).map(([k,v])=>'<option value="'+k+'">'+v.l+'</option>').join('')+'</select></div><div><label class="block text-sm font-medium mb-1">Subcategory</label><select id="ps" class="inp" required><option value="">Select cat first</option></select></div></div><button type="submit" class="btnp w-full py-2.5">Add Product</button></form></div></div>';}
function adminSet(){const s=gS();return'<div class="max-w-lg"><div class="bg-white rounded-lg border border-bord p-5 mb-5"><h3 class="font-semibold text-sm mb-4 flex items-center gap-2"><i class="fa-solid fa-store text-terracotta"></i>Store Info</h3><form onsubmit="hSave(event)"><div class="mb-3"><label class="block text-sm font-medium mb-1">Phone</label><input type="tel" id="sp" class="inp" value="'+s.phone+'" required><p class="text-[10px] text-warmgray mt-0.5">Include country code for WhatsApp.</p></div><div class="mb-3"><label class="block text-sm font-medium mb-1">Email</label><input type="email" id="se" class="inp" value="'+s.email+'" required></div><div class="mb-3"><label class="block text-sm font-medium mb-1">Address</label><textarea id="sa" class="inp" rows="2" required>'+s.address+'</textarea></div><div class="mb-5"><label class="block text-sm font-medium mb-1">Currency</label><input type="text" id="sc" class="inp" value="'+s.cur+'" maxlength="5" required></div><button type="submit" class="btnp w-full py-2.5">Save</button></form></div><div class="bg-white rounded-lg border border-bord p-5"><h3 class="font-semibold text-sm mb-4 flex items-center gap-2"><i class="fa-solid fa-key text-warmgray"></i>Change Password</h3><form onsubmit="hCP(event)"><div class="mb-3"><label class="block text-sm font-medium mb-1">Current</label><input type="password" id="po2" class="inp" required></div><div class="mb-3"><label class="block text-sm font-medium mb-1">New</label><input type="password" id="pn2" class="inp" minlength="6" required></div><div class="mb-5"><label class="block text-sm font-medium mb-1">Confirm</label><input type="password" id="pc2" class="inp" minlength="6" required></div><button type="submit" class="btns w-full py-2.5">Update Password</button></form></div></div>';}

// Admin handlers
async function hLogin(e){e.preventDefault();if(await vp(document.getElementById('lp').value)){sA(true);nav('/admin/dashboard');toast('Welcome back!');}else{document.getElementById('le').classList.remove('hidden');document.getElementById('lp').value='';}}
function hLogout(){sA(false);nav('/');toast('Signed out.','info');}
let cImg=null;
function hFS(input){if(input.files&&input.files[0])pFile(input.files[0]);}
function hDrop(e){e.preventDefault();e.currentTarget.style.borderColor='#E8E2D9';if(e.dataTransfer.files&&e.dataTransfer.files[0])pFile(e.dataTransfer.files[0]);}
async function pFile(file){if(!file.type.startsWith('image/')){toast('Select an image.','error');return;}if(file.size>5*1024*1024){toast('Max 5MB.','error');return;}try{cImg=await ci(file);document.getElementById('up').classList.add('hidden');const v=document.getElementById('uv');v.classList.remove('hidden');v.innerHTML='<img src="'+cImg+'" class="mx-auto rounded-lg max-h-40 object-cover"><p class="text-[10px] text-warmgray mt-1">Click to change</p>';}catch(e){toast('Failed.','error');}}
function uSubs(){const cat=document.getElementById('pc').value;const sel=document.getElementById('ps');sel.innerHTML='<option value="">Select...</option>';if(cat&&CATS[cat])CATS[cat].s.forEach(s=>{sel.innerHTML+='<option value="'+s+'">'+s+'</option>';});}
function hAdd(e){e.preventDefault();if(!cImg){toast('Upload an image.','error');return;}const p={id:gid(),name:document.getElementById('pn').value.trim(),brand:document.getElementById('pb').value.trim(),price:+document.getElementById('pp').value,orig:+document.getElementById('po').value||0,desc:document.getElementById('pd').value.trim(),cat:document.getElementById('pc').value,sub:document.getElementById('ps').value,imgs:[cImg,cImg,cImg,cImg],sizes:['M','L','XL'],colors:['Default'],fabric:'Mixed',care:'Machine Wash',cond:'Good',status:'available',createdAt:Date.now(),rating:+(4+Math.random()).toFixed(1),rcnt:Math.floor(5+Math.random()*20)};if(!p.name||!p.price||!p.desc||!p.cat||!p.sub){toast('Fill all fields.','error');return;}try{const pr=gP();pr.unshift(p);sP(pr);cImg=null;toast('"'+p.name+'" added!');nav('/admin/dashboard');}catch(e){toast('Storage full!','error');}}
function dProd(id){om('<div class="p-6 text-center"><div class="w-12 h-12 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-3"><i class="fa-solid fa-trash text-red-500"></i></div><h3 class="font-bold text-lg mb-2">Delete?</h3><p class="text-warmgray text-sm mb-5">Cannot be undone.</p><div class="flex gap-2 justify-center"><button onclick="cm()" class="btns px-5 py-2 text-sm">Cancel</button><button onclick="cDel(\''+id+'\')" class="btnp px-5 py-2" style="background:#C44B3E">Delete</button></div></div>');}
function cDel(id){sP(gP().filter(p=>p.id!==id));cm();toast('Deleted.','info');route();}
function mSold(id){const pr=gP();const p=pr.find(x=>x.id===id);if(p){p.status='sold';sP(pr);toast('"'+p.name+'" marked sold.','info');route();}}
function mAvail(id){const pr=gP();const p=pr.find(x=>x.id===id);if(p){p.status='available';sP(pr);toast('"'+p.name+'" restored.');route();}}
function hSave(e){e.preventDefault();sS({phone:document.getElementById('sp').value.trim(),email:document.getElementById('se').value.trim(),address:document.getElementById('sa').value.trim(),cur:document.getElementById('sc').value.trim()||'PKR '});toast('Settings saved!');}
async function hCP(e){e.preventDefault();const o=document.getElementById('po2').value,n=document.getElementById('pn2').value,c=document.getElementById('pc2').value;if(n!==c){toast('Passwords don\'t match.','error');return;}if(n.length<6){toast('Min 6 characters.','error');return;}if(await cp(o,n)){toast('Password updated!');document.getElementById('po2').value='';document.getElementById('pn2').value='';document.getElementById('pc2').value='';}else{toast('Wrong current password.','error');}}

// Mobile menus
function mmenu(){document.getElementById('mm')?.classList.toggle('hidden');}
function cmm(){const m=document.getElementById('mm');if(m)m.classList.add('hidden');}
function tas(){document.getElementById('as')?.classList.toggle('open');document.getElementById('sov')?.classList.toggle('show');}
function cas(){document.getElementById('as')?.classList.remove('open');document.getElementById('sov')?.classList.remove('show');}

// Scroll reveal
function initReveal(){const obs=new IntersectionObserver((entries)=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');obs.unobserve(e.target);}});},{threshold:0.06,rootMargin:'0px 0px -30px 0px'});document.querySelectorAll('.reveal:not(.vis)').forEach(el=>obs.observe(el));}

(async()=>{if(!localStorage.getItem('tth'))localStorage.setItem('tth',await hp(DPWD));if(!localStorage.getItem('ttp'))localStorage.setItem('ttp',JSON.stringify(allSeed()));if(!localStorage.getItem('tts'))sS(gS());})();
window.addEventListener('hashchange',route);
route();
setTimeout(ucc,100);
