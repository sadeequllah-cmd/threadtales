<style>
:root{--bg:#FAF7F2;--fg:#1A1A1A;--muted:#8A8278;--accent:#C45D3E;--card:#fff;--border:#E8E2D9;--sand:#F0EBE3}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{background:var(--bg);color:var(--fg);font-family:'DM Sans',sans-serif;margin:0}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--sand)}::-webkit-scrollbar-thumb{background:var(--muted);border-radius:3px}
.skip-link{position:absolute;top:-100px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 20px;border-radius:0 0 8px 8px;z-index:9999;font-weight:600;font-size:14px;transition:top .2s}.skip-link:focus{top:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes slideRight{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(15px,-20px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-10px,15px)}}
.anim-fade-up{animation:fadeUp .5s ease-out both}.anim-fade-in{animation:fadeIn .35s ease-out both}.anim-scale-in{animation:scaleIn .3s ease-out both}.anim-slide-right{animation:slideRight .35s ease-out both}
.stagger-1{animation-delay:.05s}.stagger-2{animation-delay:.1s}.stagger-3{animation-delay:.15s}.stagger-4{animation-delay:.2s}.stagger-5{animation-delay:.25s}
.hero-bg{background:linear-gradient(135deg,#FAF7F2 0%,#F0EBE3 40%,#E8D5C4 70%,#D4B89C 100%);position:relative;overflow:hidden}
.hero-bg::before{content:'';position:absolute;top:-50%;right:-20%;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(196,93,62,.08)0%,transparent 70%);animation:float1 12s ease-in-out infinite}
.hero-bg::after{content:'';position:absolute;bottom:-30%;left:-10%;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(74,124,89,.06)0%,transparent 70%);animation:float2 10s ease-in-out infinite}
.product-card{transition:transform .25s,box-shadow .25s}.product-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(26,26,26,.07)}
.product-card img{transition:transform .4s}.product-card:hover img{transform:scale(1.04)}
.sold-overlay{position:absolute;inset:0;background:rgba(26,26,26,.4);display:flex;align-items:center;justify-content:center;z-index:2;border-radius:inherit}
.sold-badge{background:var(--fg);color:var(--bg);padding:5px 16px;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;transform:rotate(-8deg)}
.cat-pill{transition:all .2s;white-space:nowrap;border:1.5px solid var(--border);background:var(--card);cursor:pointer}
.cat-pill:hover{border-color:var(--accent);color:var(--accent)}.cat-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.toast{animation:slideRight .3s ease-out both}
.modal-backdrop{background:rgba(26,26,26,.5);backdrop-filter:blur(3px)}.modal-content{animation:scaleIn .25s ease-out both}
.input-field{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);font-family:inherit;font-size:14px;transition:border-color .2s;outline:none}
.input-field:focus{border-color:var(--accent)}.input-field::placeholder{color:var(--muted)}
.btn-primary{background:var(--accent);color:#fff;padding:10px 22px;border-radius:8px;font-weight:600;font-size:14px;border:none;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-primary:hover{background:var(--accent-dark,#A84B30);transform:translateY(-1px)}
.btn-secondary{background:transparent;color:var(--fg);padding:10px 22px;border-radius:8px;font-weight:600;font-size:14px;border:1.5px solid var(--border);cursor:pointer;transition:all .2s;font-family:inherit}
.btn-secondary:hover{border-color:var(--fg)}
.btn-wa{background:#25D366;color:#fff;padding:8px 16px;border-radius:8px;font-weight:600;font-size:13px;border:none;cursor:pointer;transition:all .2s;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.btn-wa:hover{background:#1EBE5A;transform:translateY(-1px)}
.btn-cart{background:#F59E0B;color:#fff;padding:10px 22px;border-radius:8px;font-weight:700;font-size:14px;border:none;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-cart:hover{background:#D97706;transform:translateY(-1px)}
.btn-buy{background:var(--accent);color:#fff;padding:10px 22px;border-radius:8px;font-weight:700;font-size:14px;border:none;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-buy:hover{background:#A84B30;transform:translateY(-1px)}
.upload-area{border:2px dashed var(--border);border-radius:10px;padding:28px;text-align:center;cursor:pointer;transition:all .2s;background:var(--sand)}
.upload-area:hover,.upload-area.dragover{border-color:var(--accent);background:rgba(196,93,62,.04)}
.admin-table{width:100%;border-collapse:separate;border-spacing:0}
.admin-table th{text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);border-bottom:1.5px solid var(--border);font-weight:600}
.admin-table td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
.admin-table tr:hover td{background:var(--sand)}
.star{color:#F59E0B}.star-empty{color:#D1D5DB}
.size-btn{padding:6px 14px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;background:#fff;font-family:inherit}
.size-btn:hover{border-color:var(--accent)}.size-btn.selected{border-color:var(--accent);background:rgba(196,93,62,.06);color:var(--accent);font-weight:700}
.color-swatch{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);cursor:pointer;transition:all .15s}
.color-swatch:hover{transform:scale(1.15)}.color-swatch.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(196,93,62,.3)}
.hscroll{display:flex;overflow-x:auto;gap:12px;scroll-snap-type:x mandatory;-ms-overflow-style:none;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}.hscroll>*{scroll-snap-align:start;flex-shrink:0}
.reveal{opacity:0;transform:translateY(20px);transition:all .5s cubic-bezier(.22,1,.36,1)}.reveal.visible{opacity:1;transform:translateY(0)}
.rating-bar{height:14px;border-radius:2px;background:#F59E0B;transition:width .6s ease}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}.sidebar-overlay.show{display:block}
.admin-sidebar{background:var(--fg);color:#fff;min-height:100vh;width:250px;transition:transform .3s}
.admin-sidebar a{transition:all .2s;border-radius:6px}.admin-sidebar a:hover{background:rgba(255,255,255,.08)}.admin-sidebar a.active{background:var(--accent)}
.shortcuts-panel{position:fixed;bottom:20px;right:20px;z-index:95;width:340px;max-height:80vh;overflow-y:auto;background:#fff;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.15);padding:20px;animation:scaleIn .2s ease-out both}
.kbd{display:inline-block;padding:2px 6px;background:#F3F4F6;border:1px solid #D1D5DB;border-radius:4px;font-size:11px;font-family:monospace;color:#374151;box-shadow:0 1px 0 #D1D5DB}
.detail-img-main{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:zoom-in}
.detail-thumb{width:56px;height:56px;object-fit:cover;border-radius:6px;border:2px solid transparent;cursor:pointer;transition:all .15s}
.detail-thumb:hover{border-color:var(--accent)}.detail-thumb.active{border-color:var(--accent);opacity:1}
.detail-thumb:not(.active){opacity:.6}
@media(max-width:768px){.admin-sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%)}.admin-sidebar.open{transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

async function hashPwd(p){const e=new TextEncoder().encode(p);const b=await crypto.subtle.digest('SHA-256',e);return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
async function verifyPwd(p){const s=localStorage.getItem('tt_pwd_hash');if(!s){const h=await hashPwd(DEFAULT_PWD);localStorage.setItem('tt_pwd_hash',h);return p===DEFAULT_PWD;}return await hashPwd(p)===s;}
async function changePwd(o,n){if(!(await verifyPwd(o)))return false;localStorage.setItem('tt_pwd_hash',await hashPwd(n));return true;}
function genId(){return 'p'+Date.now()+Math.random().toString(36).substr(2,4);}
function fmtPrice(p){return getSettings().currency+p.toLocaleString('en-PK');}
function waUrl(prod,size,color){const s=getSettings();const ph=s.phone.replace(/[^0-9]/g,'');let msg=`Hi! I'm interested in "${prod.name}" (${prod.brand}) priced at ${fmtPrice(prod.price)}.`;if(size)msg+=` Size: ${size}.`;if(color)msg+=` Color: ${color}.`;msg+=' Is it available?';return`https://wa.me/${ph}?text=${encodeURIComponent(msg)}`;}
function starsHTML(rating,size='text-sm'){let h='';for(let i=1;i<=5;i++){if(i<=Math.floor(rating))h+=`<i class="fa-solid fa-star star ${size}"></i>`;else if(i-rating<1)h+=`<i class="fa-solid fa-star-half-stroke star ${size}"></i>`;else h+=`<i class="fa-regular fa-star star-empty ${size}"></i>`;}return h;}
function genReviews(productId, count){
  const reviews=[];const n=Math.min(count,6);
  for(let i=0;i<n;i++){
    const stars=Math.random()>0.3?Math.floor(4+Math.random()*1.1):Math.floor(3+Math.random()*1.1);
    reviews.push({name:REVIEWERS[(productId.length+i)%REVIEWERS.length],rating:stars,text:REVIEW_TEMPLATES[(productId.charCodeAt(1)+i)%REVIEW_TEMPLATES.length],date:`May ${5+i*3}, 2025`,verified:i<4,helpful:Math.floor(Math.random()*30)});
  }
  return reviews;
}
function compressImage(file,maxW=800,q=0.7){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error('Failed'));r.onload=(e)=>{const img=new Image();img.onerror=()=>rej(new Error('Invalid'));img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;if(w>maxW){h=(maxW/w)*h;w=maxW;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q));};img.src=e.target.result;};r.readAsDataURL(file);});}

function showToast(msg,type='success',dur=3500){const c=document.getElementById('toast-container');const cols={success:'border-l-4 border-sage bg-white',error:'border-l-4 border-red-500 bg-white',info:'border-l-4 border-terracotta bg-white'};const icons={success:'fa-circle-check text-sage',error:'fa-circle-xmark text-red-500',info:'fa-circle-info text-terracotta'};const el=document.createElement('div');el.className=`toast pointer-events-auto ${cols[type]} rounded-xl shadow-lg px-4 py-3 flex items-start gap-3`;el.innerHTML=`<i class="fa-solid ${icons[type]} mt-0.5"></i><span class="text-sm text-charcoal flex-1">${msg}</span><button onclick="this.parentElement.remove()" class="text-warmgray hover:text-charcoal text-xs ml-1"><i class="fa-solid fa-xmark"></i></button>`;c.appendChild(el);setTimeout(()=>{if(el.parentElement){el.style.opacity='0';el.style.transform='translateX(30px)';el.style.transition='all .3s';setTimeout(()=>el.remove(),300);}},dur);}

/* Detail page JS helpers */
let selectedSize='', selectedColor='';
function selectSize(el,size){document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');selectedSize=size;document.getElementById('selected-size-name').textContent=size;updateBuyLink();}
function selectColor(el,color){document.querySelectorAll('.color-swatch').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');selectedColor=color;document.getElementById('selected-color-name').textContent=color;updateBuyLink();}
function updateBuyLink(){const{id}=getRoute().parts;const prod=getProducts().find(p=>p.id===id);if(prod&&document.getElementById('wa-buy-btn')){document.getElementById('wa-buy-btn').href=waUrl(prod,selectedSize||prod.sizes[0],selectedColor||prod.colors[0]);}}
function switchImage(src,el){document.getElementById('main-product-img').src=src;document.querySelectorAll('.detail-thumb').forEach(t=>t.classList.remove('active'));el.classList.add('active');}
function addToCartFromDetail(prodId){const prod=getProducts().find(p=>p.id===prodId);addToCart(prodId,selectedSize||prod.sizes[0],selectedColor||prod.colors[0]);}
function zoomImage(src){openModal(`<div class="p-2"><img src="${src}" alt="Zoomed" class="w-full rounded-xl"><button onclick="closeModal()" class="absolute top-3 right-3 w-9 h-9 bg-white/90 rounded-full flex items-center justify-center shadow-sm hover:bg-white"><i class="fa-solid fa-xmark text-sm"></i></button></div>`);}
function showSizeChart(){
  openModal(`
    <div class="p-6">
      <h3 class="font-bold text-lg mb-4">Size Chart</h3>
      <table class="w-full text-sm border-collapse">
        <tr class="bg-sand"><th class="border border-bord px-3 py-2 text-left">Size</th><th class="border border-bord px-3 py-2">Chest (in)</th><th class="border border-bord px-3 py-2">Waist (in)</th><th class="border border-bord px-3 py-2">Length (in)</th></tr>
        ${[['S/28',36,28,26],['M/30',38,30,27],['L/32',40,32,28],['XL/34',42,34,29],['XXL/36',44,36,30],['38',40,32,28],['40',42,34,29],['42',44,36,30],['44',46,38,31]].map(([s,c,w,l])=>`<tr><td class="border border-bord px-3 py-2 font-medium">${s}</td><td class="border border-bord px-3 py-2 text-center">${c}</td><td class="border border-bord px-3 py-2 text-center">${w}</td><td class="border border-bord px-3 py-2 text-center">${l}</td></tr>`).join('')}
      </table>
      <p class="text-xs text-warmgray mt-3">These are approximate measurements. Pre-loved items may vary slightly.</p>
    </div>`);
}
function toggleDeliverTo(){
  openModal(`
    <div class="p-6">
      <h3 class="font-bold text-lg mb-4">Choose your delivery location</h3>
      <div class="space-y-2">
        ${['Pakistan','Karachi','Lahore','Islamabad','Rawalpindi','Faisalabad','Multan','Peshawar'].map((loc,i)=>`
        <button onclick="document.getElementById('deliver-text').textContent='Deliver to ${loc}';closeModal();showToast('Delivery location updated.','info')" class="w-full text-left px-4 py-3 rounded-lg border border-bord hover:border-terracotta hover:bg-sand/50 transition-colors flex items-center gap-3 ${i===0?'border-terracotta bg-sand/50':''}">
          <i class="fa-solid fa-location-dot text-terracotta"></i><span class="text-sm font-medium">${loc}</span>
        </button>`).join('')}
      </div>

function renderProductGrid(products){
  if(!products.length)return`<div class="text-center py-16 anim-fade-up"><div class="w-16 h-16 bg-sand rounded-full flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-shirt text-xl text-warmgray"></i></div><h3 class="font-semibold text-lg mb-1">No items found</h3><p class="text-warmgray text-sm">Try a different search or category.</p></div>`;
  const avail=products.filter(p=>p.status==='available');const sold=products.filter(p=>p.status==='sold');
  let h=`<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 md:gap-4">${avail.map((p,i)=>renderProductCard(p,i)).join('')}</div>`;
  if(sold.length){h+=`<div class="mt-10 mb-1"><h3 class="text-[10px] font-semibold text-warmgray uppercase tracking-widest">Previously Sold</h3></div><div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 md:gap-4 opacity-50">${sold.map((p,i)=>renderProductCard(p,i)).join('')}</div>`;}
  return h;
}

let currentSearch='',currentFilterCat=null;
function filterCategory(cat){currentFilterCat=cat;currentSearch='';const si=document.getElementById('search-input');if(si)si.value='';refreshGrid();}
function handleSearch(q){currentSearch=q.toLowerCase().trim();currentFilterCat=null;refreshGrid();}
function refreshGrid(){const grid=document.getElementById('product-grid');if(!grid)return;let prods=getProducts();if(currentFilterCat)prods=prods.filter(p=>p.category===currentFilterCat);if(currentSearch)prods=prods.filter(p=>p.name.toLowerCase().includes(currentSearch)||p.description.toLowerCase().includes(currentSearch)||p.subcategory.toLowerCase().includes(currentSearch)||p.brand.toLowerCase().includes(currentSearch)||(CATS[p.category]?.label||'').toLowerCase().includes(currentSearch));grid.innerHTML=renderProductGrid(prods);initScrollReveal();}

/* ============================================================
   ADMIN
   ============================================================ */
function renderAdminLogin(){return`<div class="min-h-screen bg-cream flex items-center justify-center p-4"><div class="bg-white rounded-2xl border border-bord shadow-sm p-7 w-full max-w-sm anim-scale-in"><div class="text-center mb-7"><div class="w-12 h-12 bg-charcoal rounded-xl flex items-center justify-center mx-auto mb-3"><i class="fa-solid fa-lock text-white"></i></div><h1 class="font-display font-800 text-xl">Admin Login</h1><p class="text-warmgray text-xs mt-1">ThreadTales Dashboard</p></div><form onsubmit="handleLogin(event)"><label class="block text-sm font-medium mb-1">Password</label><input type="password" id="login-pwd" class="input-field mb-3" placeholder="Enter admin password" required autofocus><p id="login-error" class="text-red-500 text-xs mb-2 hidden">Incorrect password.</p><button type="submit" class="btn-primary w-full py-2.5">Sign In</button></form><a href="#/" class="block text-center text-sm text-warmgray hover:text-charcoal mt-3">Back to Store</a></div></div>`;}
function renderAdminLayout(page){
  const pages=[{key:'dashboard',label:'Dashboard',icon:'fa-grid-2'},{key:'add-product',label:'Add Product',icon:'fa-plus'},{key:'settings',label:'Settings',icon:'fa-gear'}];
  const a=page||'dashboard';
  let c='';if(a==='dashboard')c=renderAdminDashboard();else if(a==='add-product')c=renderAdminAddProduct();else if(a==='settings')c=renderAdminSettings();else c=renderAdminDashboard();
  return`<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeAdminSidebar()"></div><div class="flex min-h-screen">
    <aside class="admin-sidebar fixed md:sticky top-0 flex-shrink-0 p-4 flex flex-col" id="admin-sidebar">
      <div class="flex items-center gap-2 mb-6"><div class="w-7 h-7 bg-terracotta rounded-lg flex items-center justify-center"><i class="fa-solid fa-scissors text-white text-[10px]"></i></div><span class="font-display font-800 text-white text-sm">ThreadTales</span></div>
      <nav class="flex flex-col gap-0.5 flex-1">${pages.map(p=>`<a href="#/admin/${p.key}" class="flex items-center gap-2.5 px-3 py-2 text-sm ${a===p.key?'active':'text-white/50'}" onclick="closeAdminSidebar()"><i class="fa-solid ${p.icon} w-4 text-center text-xs"></i>${p.label}</a>`).join('')}</nav>
      <div class="border-t border-white/10 pt-3 flex flex-col gap-0.5"><a href="#/" class="flex items-center gap-2.5 px-3 py-2 text-sm text-white/50"><i class="fa-solid fa-arrow-left w-4 text-center text-xs"></i>Store</a><button onclick="handleLogout()" class="flex items-center gap-2.5 px-3 py-2 text-sm text-white/30 hover:text-white/70 text-left"><i class="fa-solid fa-right-from-bracket w-4 text-center text-xs"></i>Sign Out</button></div>
    </aside>
    <div class="flex-1 flex flex-col min-w-0">
      <header class="sticky top-0 z-20 bg-cream/80 backdrop-blur-lg border-b border-bord px-4 py-2.5 flex items-center gap-3"><button onclick="toggleAdminSidebar()" class="md:hidden p-1.5 hover:bg-sand rounded-lg" aria-label="Menu"><i class="fa-solid fa-bars text-xs"></i></button><h2 class="font-semibold text-sm">${pages.find(p=>p.key===a)?.label}</h2></header>
      <main class="flex-1 p-4 sm:p-6 anim-fade-in">${c}</main>
    </div></div>`;
}
function renderAdminDashboard(){
  const prods=getProducts();const avail=prods.filter(p=>p.status==='available').length;const sold=prods.filter(p=>p.status==='sold').length;const val=prods.filter(p=>p.status==='available').reduce((a,p)=>a+p.price,0);
  return`<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
    <div class="bg-white rounded-lg border border-bord p-4"><p class="text-[10px] text-warmgray font-medium uppercase tracking-wider mb-0.5">Total</p><p class="text-xl font-bold">${prods.length}</p></div>
    <div class="bg-white rounded-lg border border-bord p-4"><p class="text-[10px] text-warmgray font-medium uppercase tracking-wider mb-0.5">Available</p><p class="text-xl font-bold text-sage">${avail}</p></div>
    <div class="bg-white rounded-lg border border-bord p-4"><p class="text-[10px] text-warmgray font-medium uppercase tracking-wider mb-0.5">Sold</p><p class="text-xl font-bold text-warmgray">${sold}</p></div>
    <div class="bg-white rounded-lg border border-bord p-4"><p class="text-[10px] text-warmgray font-medium uppercase tracking-wider mb-0.5">Value</p><p class="text-xl font-bold text-terracotta">${fmtPrice(val)}</p></div>
  </div>
  <div class="bg-white rounded-lg border border-bord overflow-hidden">
    <div class="px-4 py-3 border-b border-bord flex items-center justify-between"><h3 class="font-semibold text-sm">Products</h3><a href="#/admin/add-product" class="btn-primary text-xs px-3 py-1.5"><i class="fa-solid fa-plus mr-1"></i>Add</a></div>
    <div class="overflow-x-auto"><table class="admin-table"><thead><tr><th>Product</th><th class="hidden sm:table-cell">Cat</th><th class="hidden md:table-cell">Price</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>${prods.slice(0,50).map(p=>`<tr><td><div class="flex items-center gap-2"><img src="${p.images[0]}" alt="${p.name}" class="w-8 h-8 rounded object-cover flex-shrink-0"><span class="font-medium text-xs truncate max-w-[140px]">${p.name}</span></div></td><td class="hidden sm:table-cell"><span class="text-[10px] bg-sand px-1.5 py-0.5 rounded">${CATS[p.category]?.label||p.category}</span></td><td class="hidden md:table-cell font-semibold text-xs">${fmtPrice(p.price)}</td><td><span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${p.status==='available'?'bg-sage/10 text-sage':'bg-charcoal/10 text-charcoal'}">${p.status}</span></td><td><div class="flex gap-1">${p.status==='available'?`<button onclick="markSold('${p.id}')" class="text-[10px] font-semibold text-sage bg-sage/10 px-2 py-1 rounded hover:bg-sage/20">Sold</button>`:`<button onclick="markAvail('${p.id}')" class="text-[10px] font-semibold text-warmgray bg-sand px-2 py-1 rounded hover:bg-bord">Restore</button>`}<button onclick="deleteProd('${p.id}')" class="text-[10px] font-semibold text-red-500 bg-red-50 px-2 py-1 rounded hover:bg-red-100">Del</button></div></td></tr>`).join('')}</tbody></table></div>
    ${prods.length>50?`<p class="text-center text-xs text-warmgray py-3">Showing 50 of ${prods.length}. Use search to find specific items.</p>`:''}
  </div>`;
}
function renderAdminAddProduct(){
  return`<div class="max-w-lg"><div class="bg-white rounded-lg border border-bord p-5">
    <form onsubmit="handleAddProduct(event)">
      <div class="mb-5"><label class="block text-sm font-medium mb-1.5">Image</label><div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="handleDrop(event)"><div id="upload-placeholder"><i class="fa-solid fa-cloud-arrow-up text-xl text-warmgray mb-1"></i><p class="text-xs text-warmgray">Click or drag image</p></div><div id="upload-preview" class="hidden"></div></div><input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileSelect(this)"></div>
      <div class="mb-3"><label class="block text-sm font-medium mb-1">Name</label><input type="text" id="prod-name" class="input-field" required></div>
      <div class="mb-3"><label class="block text-sm font-medium mb-1">Brand</label><input type="text" id="prod-brand" class="input-field" required></div>
      <div class="mb-3"><label class="block text-sm font-medium mb-1">Price</label><input type="number" id="prod-price" class="input-field" min="1" required></div>
      <div class="mb-3"><label class="block text-sm font-medium mb-1">Original Price (optional)</label><input type="number" id="prod-orig" class="input-field" min="0"></div>
      <div class="mb-3"><label class="block text-sm font-medium mb-1">Description</label><textarea id="prod-desc" class="input-field" rows="2" required></textarea></div>
      <div class="grid grid-cols-2 gap-3 mb-5"><div><label class="block text-sm font-medium mb-1">Category</label><select id="prod-cat" class="input-field" onchange="updateSubs()" required><option value="">Select...</option>${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select></div><div><label class="block text-sm font-medium mb-1">Subcategory</label><select id="prod-sub" class="input-field" required><option value="">Select cat first</option></select></div></div>
      <button type="submit" class="btn-primary w-full py-2.5">Add Product</button>
    </form></div></div>`;
}
function renderAdminSettings(){
  const s=getSettings();
  return`<div class="max-w-lg">
    <div class="bg-white rounded-lg border border-bord p-5 mb-5"><h3 class="font-semibold text-sm mb-4 flex items-center gap-2"><i class="fa-solid fa-store text-terracotta"></i>Store Info</h3>
    <form onsubmit="handleSaveSettings(event)">
      <div class="mb-3"><label class="block text-sm font-medium mb-1">Phone</label><input type="tel" id="set-phone" class="input-field" value="${s.phone}" required><p class="text-[10px] text-warmgray mt-0.5">Used for WhatsApp button. Include country code.</p></div>
      <div class="mb-3"><label class="block text-sm font-medium mb-1">Email</label><input type="email" id="set-email" class="input-field" value="${s.email}" required></div>
      <div class="mb-3"><label class="block text-sm font-medium mb-1">Address</label><textarea id="set-address" class="input-field" rows="2" required>${s.address}</textarea></div>
      <div class="mb-5"><label class="block text-sm font-medium mb-1">Currency</label><input type="text" id="set-currency" class="input-field" value="${s.currency}" maxlength="5" required></div>
      <button type="submit" class="btn-primary w-full py-2.5">Save</button>
    </form></div>
    <div class="bg-white rounded-lg border border-bord p-5"><h3 class="font-semibold text-sm mb-4 flex items-center gap-2"><i class="fa-solid fa-key text-warmgray"></i>Change Password</h3>
    <form onsubmit="handleChangePwd(event)">
      <div class="mb-3"><label class="block text-sm font-medium mb-1">Current</label><input type="password" id="pwd-old" class="input-field" required></div>
      <div class="mb-3"><label class="block text-sm font-medium mb-1">New</label><input type="password" id="pwd-new" class="input-field" minlength="6" required></div>
      <div class="mb-5"><label class="block text-sm font-medium mb-1">Confirm</label><input type="password" id="pwd-confirm" class="input-field" minlength="6" required></div>
      <button type="submit" class="btn-secondary w-full py-2.5">Update Password</button>
    </form></div></div>`;
}

/* ============================================================
   ADMIN EVENT HANDLERS
   ============================================================ */
async function handleLogin(e){e.preventDefault();if(await verifyPwd(document.getElementById('login-pwd').value)){setAuth(true);navigate('/admin/dashboard');showToast('Welcome back!');}else{document.getElementById('login-error').classList.remove('hidden');document.getElementById('login-pwd').value='';}}
function handleLogout(){setAuth(false);navigate('/');showToast('Signed out.','info');}
let currentImgData=null;
function handleFileSelect(input){if(input.files&&input.files[0])processFile(input.files[0]);}
function handleDrop(e){e.preventDefault();e.currentTarget.classList.remove('dragover');if(e.dataTransfer.files&&e.dataTransfer.files[0])processFile(e.dataTransfer.files[0]);}
async function processFile(file){if(!file.type.startsWith('image/')){showToast('Select an image.','error');return;}if(file.size>5*1024*1024){showToast('Max 5MB.','error');return;}try{currentImgData=await compressImage(file,800,0.7);document.getElementById('upload-placeholder').classList.add('hidden');const pv=document.getElementById('upload-preview');pv.classList.remove('hidden');pv.innerHTML=`<img src="${currentImgData}" class="mx-auto rounded-lg max-h-40 object-cover"><p class="text-[10px] text-warmgray mt-1">Click to change</p>`;}catch(e){showToast('Failed to process image.','error');}}
function updateSubs(){const cat=document.getElementById('prod-cat').value;const sel=document.getElementById('prod-sub');sel.innerHTML='<option value="">Select...</option>';if(cat&&CATS[cat])CATS[cat].subs.forEach(s=>{sel.innerHTML+=`<option value="${s}">${s}</option>`;});}
function handleAddProduct(e){e.preventDefault();if(!currentImgData){showToast('Upload an image.','error');return;}const p={id:genId(),name:document.getElementById('prod-name').value.trim(),brand:document.getElementById('prod-brand').value.trim(),price:+document.getElementById('prod-price').value,originalPrice:+document.getElementById('prod-orig').value||0,description:document.getElementById('prod-desc').value.trim(),category:document.getElementById('prod-cat').value,subcategory:document.getElementById('prod-sub').value,images:[currentImgData,currentImgData,currentImgData,currentImgData],sizes:['M','L','XL'],colors:['Default'],fabricType:'Mixed',careInstructions:'Machine Wash',condition:'Good',status:'available',createdAt:Date.now(),rating:+(4+Math.random()).toFixed(1),reviewCount:Math.floor(5+Math.random()*20)};if(!p.name||!p.price||!p.description||!p.category||!p.subcategory){showToast('Fill all fields.','error');return;}try{const prods=getProducts();prods.unshift(p);saveProducts(prods);currentImgData=null;showToast(`"${p.name}" added!`);navigate('/admin/dashboard');}catch(e){showToast('Storage full! Delete old products.','error');}}
function deleteProd(id){openModal(`<div class="p-6 text-center"><div class="w-12 h-12 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-3"><i class="fa-solid fa-trash text-red-500"></i></div><h3 class="font-bold text-lg mb-2">Delete?</h3><p class="text-warmgray text-sm mb-5">This cannot be undone.</p><div class="flex gap-2 justify-center"><button onclick="closeModal()" class="btn-secondary px-5 py-2 text-sm">Cancel</button><button onclick="confirmDel('${id}')" class="btn-danger px-5 py-2">Delete</button></div></div>`);}
function confirmDel(id){saveProducts(getProducts().filter(p=>p.id!==id));closeModal();showToast('Deleted.','info');router();}
function markSold(id){const prods=getProducts();const p=prods.find(x=>x.id===id);if(p){p.status='sold';saveProducts(prods);showToast(`"${p.name}" marked sold.`,'info');router();}}
function markAvail(id){const prods=getProducts();const p=prods.find(x=>x.id===id);if(p){p.status='available';saveProducts(prods);showToast(`"${p.name}" restored.`);router();}}
function handleSaveSettings(e){e.preventDefault();saveSettings({phone:document.getElementById('set-phone').value.trim(),email:document.getElementById('set-email').value.trim(),address:document.getElementById('set-address').value.trim(),currency:document.getElementById('set-currency').value.trim()||'PKR '});showToast('Settings saved!');}
async function handleChangePwd(e){e.preventDefault();const o=document.getElementById('pwd-old').value,n=document.getElementById('pwd-new').value,c=document.getElementById('pwd-confirm').value;if(n!==c){showToast('Passwords don\'t match.','error');return;}if(n.length<6){showToast('Min 6 characters.','error');return;}if(await changePwd(o,n)){showToast('Password updated!');document.getElementById('pwd-old').value='';document.getElementById('pwd-new').value='';document.getElementById('pwd-confirm').value='';}else{showToast('Wrong current password.','error');}}

/* Mobile menus */
function toggleMobileMenu(){document.getElementById('mobile-menu')?.classList.toggle('hidden');}
function closeMobileMenu(){const m=document.getElementById('mobile-menu');if(m)m.classList.add('hidden');}
function toggleAdminSidebar(){document.getElementById('admin-sidebar')?.classList.toggle('open');document.getElementById('sidebar-overlay')?.classList.toggle('show');}
function closeAdminSidebar(){document.getElementById('admin-sidebar')?.classList.remove('open');document.getElementById('sidebar-overlay')?.classList.remove('show');}

/* Scroll reveal */
function initScrollReveal(){const obs=new IntersectionObserver((entries)=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target);}});},{threshold:0.06,rootMargin:'0px 0px -30px 0px'});document.querySelectorAll('.reveal:not(.visible)').forEach(el=>obs.observe(el));}

/* ============================================================
   INIT
   ============================================================ */
(async()=>{if(!localStorage.getItem('tt_pwd_hash'))localStorage.setItem('tt_pwd_hash',await hashPwd(DEFAULT_PWD));if(!localStorage.getItem('tt_products'))localStorage.setItem('tt_products',JSON.stringify(getAllSeedProducts()));if(!localStorage.getItem('tt_settings'))saveSettings(getSettings());})();
window.addEventListener('hashchange',()=>{selectedSize='';selectedColor='';router();});
router();
setTimeout(updateCartCount,100);
</script>
